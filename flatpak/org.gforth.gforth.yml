app-id: org.gforth.gforth
runtime: org.freedesktop.Platform
platform-extensions:
  - org.freedesktop.Platform.GL.default
runtime-version: "26.08"
branch: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.stb
  - org.freedesktop.Sdk.Extension.yuv
command: gforth

modules:
  - name: gforth
    buildsystem: autotools
    config-opts:
      - "CPPFLAGS=-I/usr/lib/sdk/stb/include -I/usr/lib/sdk/yuv/include"
      - "LDFLAGS=-L/usr/lib/sdk/yuv/lib"
      - "ac_cv_search_init_disassemble_info=no"
      - "--disable-lib"
      - "--with-lispdir=/app/share/emacs/site-lisp"
      - "--with-elispstartdir=/app/share/emacs/site-start.d"
    no-autogen: true
    sources:
      - type: archive
        url: https://net2o.de/gforth-dist/Snapshots/0.7.9_20261024/gforth-0.7.9_20261024.tar.xz
        sha256: b8f16950439cd2383e3ec1d8b32656c5d9088413077aa646490e3cc6b0197d48
